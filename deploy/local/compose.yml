services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: gisi_development
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d gisi_development']
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - gisi_local_postgres_data:/var/lib/postgresql/data

volumes:
    gisi_local_postgres_data:
